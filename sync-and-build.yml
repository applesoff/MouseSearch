name: Sync upstream and build image

on:
  schedule:
    - cron: "17 6 * * *"   # daily; adjust as you like
  workflow_dispatch:         # manual "Run workflow" button
    inputs:
      force_build:
        description: "Build even if upstream has no new commits"
        type: boolean
        default: false

permissions:
  contents: write   # push the merged upstream commits
  packages: write   # push to ghcr.io

env:
  UPSTREAM: sevenlayercookie/MouseSearch
  UPSTREAM_BRANCH: main

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge upstream
        id: sync
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream "${UPSTREAM_BRANCH}"
          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date with upstream."
          else
            git merge "upstream/${UPSTREAM_BRANCH}" -m "Sync with upstream"
            git push origin HEAD
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        if: steps.sync.outputs.changed == 'true' || inputs.force_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
